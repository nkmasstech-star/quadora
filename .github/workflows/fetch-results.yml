name: Fetch results
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (do not commit)'
        default: 'false'
      test:
        description: 'Send a test push only'
        default: 'false'
  schedule:
    # draw days evenings (UTC): Singapore 18:30 SGT, Malaysia 19:00 MYT, GD Lotto ~17:30 IST
    - cron: '10,40 11-14 * * *'
    # hourly, so predictions are published after their delay (2h / 24h after a result) even outside the fetch window
    - cron: '20 * * * *'
permissions:
  contents: write
concurrency:
  group: fetch-results
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test push
        if: github.event.inputs.test == 'true'
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: node tools/notify.mjs --test
      - name: Fetch
        if: github.event.inputs.test != 'true'
        run: node tools/fetch_results.mjs ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
      - name: Push notification for new draws
        if: github.event.inputs.dry != 'true' && github.event.inputs.test != 'true'
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: node tools/notify.mjs
      - name: Make predictions
        if: github.event.inputs.dry != 'true' && github.event.inputs.test != 'true'
        run: node tools/gen_predictions.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain public/data tools/notified.json)" ]; then
            git config user.name "qspot-bot"
            git config user.email "qspot-bot@users.noreply.github.com"
            git add public/data tools/notified.json
            git commit -m "Auto: new draw results"
            git pull --rebase -q
            git push
          fi
