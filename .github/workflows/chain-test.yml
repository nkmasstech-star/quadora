name: chain test
on:
  workflow_dispatch:
    inputs:
      n:
        default: '1'
permissions:
  actions: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "run ${{ github.event.inputs.n }}"
          if [ "${{ github.event.inputs.n }}" = "1" ]; then gh api -X POST repos/${{ github.repository }}/actions/workflows/chain-test.yml/dispatches -f ref=main -f 'inputs[n]=2'; fi
