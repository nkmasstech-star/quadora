name: Probe billing (one-off)
on:
  push:
    branches: [main]
    paths: ['tools/probe_billing.mjs']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: node tools/probe_billing.mjs
