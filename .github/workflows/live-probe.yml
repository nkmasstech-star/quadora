name: Live result probe (test)
on:
  workflow_dispatch:
    inputs:
      label: { description: 'label', default: 'manual' }
      stop: { description: 'stop time HH:MM UTC', default: '12:00' }
  schedule:
    # Singapore 18:30 SGT + Malaysia 19:00 MYT (10:30 / 11:00 UTC) on Wed, Sat, Sun
    - cron: '5 10 * * 0,3,6'
    # GD Lotto 19:15 Cambodia (12:15 UTC), daily
    - cron: '55 11 * * *'
permissions:
  contents: write
concurrency: { group: live-probe-${{ github.event.schedule || 'manual' }}, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        run: |
          if [ "${{ github.event.schedule }}" = "5 10 * * 0,3,6" ]; then node tools/live_probe.mjs my-sg 11:50;
          elif [ "${{ github.event.schedule }}" = "55 11 * * *" ]; then node tools/live_probe.mjs gd 12:55;
          else node tools/live_probe.mjs "${{ github.event.inputs.label }}" "${{ github.event.inputs.stop }}"; fi
      - name: Save report
        run: |
          git config user.name "live-probe"; git config user.email "actions@users.noreply.github.com"
          git add tools/live_probe
          git commit -m "live probe report" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
