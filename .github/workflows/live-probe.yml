name: Live result probe (test)
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'label'
        default: 'manual'
      stop:
        description: 'stop time HH:MM UTC'
        default: '12:00'
  schedule:
    # one window 10:00-12:00 UTC daily: Singapore 18:30 SGT, Malaysia 19:00 MYT, GD Lotto ~11:30 UTC.
    # 3 start times because GitHub sometimes delays or skips a schedule; a late duplicate just stops at 12:00.
    - cron: '55 9 * * *'
    - cron: '20 10 * * *'
    - cron: '45 10 * * *'
permissions:
  contents: write
concurrency:
  group: live-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        run: |
          if [ -n "${{ github.event.schedule }}" ]; then
            if [ "$(date -u +%H%M)" -ge 1200 ]; then echo "window over"; exit 0; fi
            node tools/live_probe.mjs evening-$(date -u +%H%M) 12:00;
          else node tools/live_probe.mjs "${{ github.event.inputs.label }}" "${{ github.event.inputs.stop }}"; fi
      - name: Save report
        run: |
          git config user.name "live-probe"; git config user.email "actions@users.noreply.github.com"
          git add tools/live_probe
          git commit -m "live probe report" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
