name: Results watch (always on)
# GitHub's cron schedules for this repo run hours late or not at all, so this job keeps itself running:
# it loops for ~5h40m, then starts its next run itself. Draw window 09:45-13:45 UTC: check every 3 min.
# Rest of the day: every 20 min (publishes predictions after their delay). The cron lines below only
# restart the chain if it ever stops.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: results-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Watch loop
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: |
          git config user.name "qspot-bot"
          git config user.email "qspot-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull --rebase -q || true
            node tools/fetch_results.mjs || true
            node tools/notify.mjs || true
            node tools/gen_predictions.mjs || true
            node tools/notify.mjs --pred || true
            if [ -n "$(git status --porcelain public/data tools/notified.json)" ]; then
              git add public/data tools/notified.json
              git commit -q -m "Auto: results/predictions (watch)"
              for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
              echo "pushed at $(date -u +%H:%M)"
            fi
            hm=$((10#$(date -u +%H%M)))
            if [ $hm -ge 945 ] && [ $hm -le 1345 ]; then sleep 180; else sleep 1200; fi
          done
      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/results-watch.yml/dispatches -f ref=main
